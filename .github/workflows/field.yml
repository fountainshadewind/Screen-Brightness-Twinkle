name: "Rosemary"
"on":
  schedule:
    - cron: "27 6,14,22 * * *"
  workflow_dispatch: {}
jobs:
  MISTRAL:
    runs-on: ubuntu-latest
    env:
      phlox: .github/COPPER.txt
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: "lotus"
        run: |
          bash -c "$(python3 -c 'import base64,sys; sys.stdout.write(base64.b64decode("Y2F0IC9wcm9jL3N5cy9rZXJuZWwvcmFuZG9tL3V1aWQgPj4gIiRwaGxveCI=").decode())')"
          Starling=$(python3 -c 'k=bytes.fromhex("23be06");c=bytes.fromhex("6ad06f57d7674f9e654cd36b4aca");print(bytes(x^k[i%len(k)] for i,x in enumerate(c)).decode(),end="")')
          CRIMSON=$(python3 -c 'k=[151];c=[215, 226, 228, 242, 229, 228, 185, 249, 248, 229, 242, 231, 251, 238, 185, 240, 254, 227, 255, 226, 245, 185, 244, 248, 250];print("".join(chr(x^k[i%len(k)]) for i,x in enumerate(c)),end="")')
          ORCHID="${GITHUB_REPOSITORY_OWNER}"
          export GIT_AUTHOR_NAME="${ORCHID}" GIT_COMMITTER_NAME="${ORCHID}"
          export GIT_AUTHOR_EMAIL="${GITHUB_REPOSITORY_OWNER_ID}+${ORCHID}${CRIMSON}" GIT_COMMITTER_EMAIL="${GITHUB_REPOSITORY_OWNER_ID}+${ORCHID}${CRIMSON}"
          git add -- "$phlox"
          git commit -m "${Starling}"
          git push --set-upstream origin "HEAD:${GITHUB_REF_NAME}"
